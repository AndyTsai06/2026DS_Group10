
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boogle - Search Engine</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1 class="logo">Boogle</h1>

        <p class="subtitle">Search the web with Tavily</p>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="輸入你想搜尋的內容..."
            >

            <button id="searchButton">搜尋</button>

        </div>

        <p id="status"></p>

        <section id="results"></section>

    </main>

    <script src="script.js"></script>

</body>

</html>
